name: Bootstrap MVP

on:
  push:
    branches: [ feature/initial-dh-sync ]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ hashFiles('bootstrap.tar.gz') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract project
        run: tar -xzf bootstrap.tar.gz
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.2.1
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Commit bootstrapped project
        run: |
          rm -f bootstrap.tar.gz .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement initial safe DH sync MVP"
          git push origin HEAD:feature/initial-dh-sync
