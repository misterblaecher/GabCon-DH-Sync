name: Bootstrap MVP

on:
  push:
    branches:
      - feature/initial-dh-sync

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Reconstruct and verify project payload
        run: |
          cat bootstrap.b64.* | base64 --decode > bootstrap.reconstructed.tar.gz
          echo "880fd60d12e9ee332566b66f471b9edd73a8708d00658944f88a7c7265199150  bootstrap.reconstructed.tar.gz" | sha256sum -c -
          tar -xzf bootstrap.reconstructed.tar.gz
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.2.1
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Commit bootstrapped project
        run: |
          rm -f bootstrap.tar.gz bootstrap.reconstructed.tar.gz bootstrap.b64.* .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement initial safe DH sync MVP"
          git push origin HEAD:feature/initial-dh-sync
