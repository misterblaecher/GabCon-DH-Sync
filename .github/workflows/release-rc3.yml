name: Publish 0.7.0 RC3

on:
  push:
    branches: [ release/0.7.0 ]
    paths:
      - '.github/workflows/release-rc3.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Create v0.7.0-rc3 prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0-rc3
          target_commitish: 53b897d4277c604be66369a350f195d7c03c7e17
          name: GabCon DH Sync 0.7.0-rc3
          prerelease: true
          files: build/libs/*.jar
          generate_release_notes: true
