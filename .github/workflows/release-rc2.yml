name: Publish 0.7.0 RC2

on:
  push:
    branches: [ release/0.7.0 ]
    paths:
      - '.github/workflows/release-rc2.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Create v0.7.0-rc2 prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0-rc2
          target_commitish: 9f3788e49941ae22d71d2b0186c8da692dc71d8e
          name: GabCon DH Sync 0.7.0-rc2
          prerelease: true
          files: build/libs/*.jar
          generate_release_notes: true
