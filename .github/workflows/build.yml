name: Build

on:
  push:
    branches: [ main, feature/initial-dh-sync ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: gabcondhsync-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
